[project]
name = "autoresearch-post-training"
version = "0.1.0"
description = "Knowledge Graph + HeteroGraphSAGE recommendation post-training benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torch-geometric>=2.5.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "requests>=2.28",
    "tomli>=2.5.0",
    "kaggle>=1.7.4.5",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
