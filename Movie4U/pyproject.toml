[project]
name = "movie4u"
version = "0.1.0"
description = "Knowledge-graph and GNN movie recommender"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pandas>=2.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "torch>=2.0",
  "torch-geometric>=2.5",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
